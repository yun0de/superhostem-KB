name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check knowledge base publish safety
        shell: bash
        run: ./scripts/check-kb-publish-safety.sh

      - name: Check knowledge base index consistency
        shell: bash
        run: ./scripts/check-kb-index-consistency.sh

      - name: Build static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/knowledge-base/html
          mkdir -p _site/knowledge-base/articles

          cp CNAME _site/CNAME

          cp "knowledge base/knowledge-base-site.html" _site/knowledge-base/knowledge-base-site.html
          cp "knowledge base/html/"*.html _site/knowledge-base/html/
          cp -R "knowledge base/html/en" _site/knowledge-base/html/en
          cp -R "knowledge base/html/vn" _site/knowledge-base/html/vn
          cp "knowledge base/articles/knowledge-base-library.html" _site/knowledge-base/articles/
          cp -R "knowledge base/assets" _site/knowledge-base/

          cp index.html _site/index.html

          # robots.txt
          printf 'User-agent: *\nAllow: /\nSitemap: https://knowledgebase.superhostem.cz/sitemap.xml\n' > _site/robots.txt

          # sitemap.xml — regenerate from repo and copy to _site
          python3 scripts/generate-sitemap.py
          cp sitemap.xml _site/sitemap.xml

          # 404.html: catch-all redirect for any URL missing /knowledge-base prefix
          cat > _site/404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="cs">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Přesměrování…</title>
            <script>
              (function () {
                var path = window.location.pathname;
                // Only attempt redirect for .html pages missing /knowledge-base/
                if (path.indexOf('/knowledge-base/') === -1 && path.indexOf('/html/') !== -1) {
                  var fixed = path.replace('/html/', '/knowledge-base/html/');
                  window.location.replace(fixed + window.location.search + window.location.hash);
                } else if (path.match(/\.html$/)) {
                  // Looks like an HTML page but unknown path — go to homepage
                  window.location.replace('/knowledge-base/html/index.html');
                }
                // Anything else (sitemap.xml, robots.txt, assets, etc.) — do nothing, show 404
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
